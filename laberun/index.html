<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LABERUN - Laberinto Tóxico Espacial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #03040a;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* HUD Superior */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    #hud > * {
      pointer-events: auto;
    }

    .btn-nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 8px 14px;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      text-decoration: none;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .hud-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .title-badge {
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      color: #f8fafc;
      text-shadow: 0 0 10px #38bdf8;
    }

    .level-label {
      font-size: 0.78rem;
      color: #38bdf8;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* Barra de Vida */
    .hp-container {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.5);
      padding: 6px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hp-bar-bg {
      width: 100px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .hp-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #10b981);
      transition: width 0.1s linear, background 0.3s;
    }
    .hp-text {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #f8fafc;
      min-width: 38px;
    }

    /* Alerta de Gas */
    #gasAlert {
      position: fixed;
      top: 64px;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: #22c55e;
      background: rgba(15, 23, 42, 0.9);
      padding: 4px 12px;
      border: 1px solid #22c55e;
      border-radius: 999px;
      display: none;
      animation: pulseAlert 0.8s infinite alternate;
      z-index: 20;
    }
    @keyframes pulseAlert {
      from { opacity: 0.6; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1.02); box-shadow: 0 0 12px rgba(34, 197, 94, 0.6); }
    }

    /* Canvas del Juego */
    #gameCanvas {
      background: #060913;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      max-width: 96vw;
      max-height: 84vh;
    }

    /* D-PAD Virtual para Desktop / Touch */
    #dpad {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 130px;
      height: 130px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      z-index: 25;
    }
    .dbtn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      font-family: 'Orbitron', monospace;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }
    .dbtn:active, .dbtn.pressed {
      background: rgba(56, 189, 248, 0.4);
      transform: scale(0.92);
      box-shadow: 0 0 12px #38bdf8;
    }
    #btnUp { grid-column: 2; grid-row: 1; }
    #btnLeft { grid-column: 1; grid-row: 2; }
    #btnDown { grid-column: 2; grid-row: 3; }
    #btnRight { grid-column: 3; grid-row: 2; }

    /* Botón de permiso giroscopio móvil */
    #gyroBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      z-index: 25;
    }

    /* Modal Fin de Juego / Victoria */
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 10, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      display: none;
    }
    #modalTitle {
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.15em;
    }
    #modalMsg {
      font-size: 1rem;
      color: #94a3b8;
    }
    .modal-btn {
      background: #38bdf8;
      color: #030712;
      border: none;
      font-family: 'Orbitron', monospace;
      font-weight: 800;
      padding: 12px 28px;
      font-size: 0.95rem;
      cursor: pointer;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body>
  <div id="hud">
    <a href="../index.html" class="btn-nav">⮌ MENÚ</a>

    <div class="hud-center">
      <div class="title-badge">LABERUN</div>
      <div class="level-label" id="levelLabel">SECTOR 01 // FÁCIL</div>
    </div>

    <div class="hp-container">
      <span style="font-size:0.75rem; color:#ef4444;">❤</span>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="hpFill"></div>
      </div>
      <span class="hp-text" id="hpText">100%</span>
    </div>
  </div>

  <div id="gasAlert">☣ GAS TÓXICO DETECTADO</div>

  <canvas id="gameCanvas"></canvas>

  <!-- D-PAD en pantalla -->
  <div id="dpad">
    <div class="dbtn" id="btnUp">▲</div>
    <div class="dbtn" id="btnLeft">◀</div>
    <div class="dbtn" id="btnDown">▼</div>
    <div class="dbtn" id="btnRight">▶</div>
  </div>

  <button id="gyroBtn">📱 ACTIVAR GIROSCOPIO</button>

  <div id="modal">
    <h2 id="modalTitle">HAS MUERTO</h2>
    <p id="modalMsg">El gas tóxico te consumió por completo.</p>
    <button class="modal-btn" id="modalBtn">REINTENTAR</button>
  </div>

  <script>
    // Audio Sintetizado Web Audio API
    class SFXEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      beep(freq, duration, type = 'sine') {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }
      damage() {
        this.beep(80, 0.08, 'sawtooth');
      }
      win() {
        [440, 554, 659, 880].forEach((f, i) => {
          setTimeout(() => this.beep(f, 0.25, 'triangle'), i * 80);
        });
      }
      lose() {
        [220, 180, 140, 90].forEach((f, i) => {
          setTimeout(() => this.beep(f, 0.3, 'sawtooth'), i * 110);
        });
      }
    }
    const sfx = new SFXEngine();

    // Configuración de Niveles
    const LEVELS = [
      { id: 1, name: "SECTOR 01 // FÁCIL", cols: 11, rows: 11, gasSpeed: 1800, hpDrain: 25 },
      { id: 2, name: "SECTOR 02 // MEDIO", cols: 15, rows: 15, gasSpeed: 1400, hpDrain: 35 },
      { id: 3, name: "SECTOR 03 // IMPOSIBLE", cols: 19, rows: 19, gasSpeed: 1000, hpDrain: 50 }
    ];

    let currentLevelIndex = 0;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let cols, rows, cellSize;
    let grid = [];
    let player = { x: 0, y: 0, vx: 0, vy: 0, radius: 0 };
    let goal = { col: 0, row: 0 };
    let hp = 100;
    let isGameOver = false;
    let gasGrid = []; // true si hay gas en la celda
    let gasQueue = []; // Cola BFS de avance de gas
    let nextGasTick = 0;
    let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

    // Generador de Laberinto (Recursive Backtracker / DFS garantizado)
    function generateMaze(c, r) {
      cols = c;
      rows = r;
      grid = Array.from({ length: rows }, () => Array(cols).fill(1)); // 1 = pared, 0 = camino

      function carve(x, y) {
        grid[y][x] = 0;
        const dirs = [
          [0, -2], [0, 2], [-2, 0], [2, 0]
        ].sort(() => Math.random() - 0.5);

        for (let [dx, dy] of dirs) {
          const nx = x + dx;
          const ny = y + dy;
          if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && grid[ny][nx] === 1) {
            grid[y + dy / 2][x + dx / 2] = 0;
            carve(nx, ny);
          }
        }
      }

      carve(1, 1);
      grid[rows - 2][cols - 2] = 0;
      grid[rows - 2][cols - 3] = 0;
      grid[rows - 3][cols - 2] = 0;
    }

    function resizeCanvas() {
      const minDimension = Math.min(window.innerWidth * 0.94, window.innerHeight * 0.82);
      cellSize = Math.floor(minDimension / cols);
      canvas.width = cols * cellSize;
      canvas.height = rows * cellSize;
      player.radius = cellSize * 0.32;
    }

    function initLevel(index) {
      currentLevelIndex = Math.min(index, LEVELS.length - 1);
      const lvl = LEVELS[currentLevelIndex];
      document.getElementById('levelLabel').textContent = lvl.name;

      generateMaze(lvl.cols, lvl.rows);
      resizeCanvas();

      // Posición inicial del jugador
      player.x = 1.5 * cellSize;
      player.y = 1.5 * cellSize;
      player.vx = 0;
      player.vy = 0;

      // Meta en la esquina inferior opuesta
      goal.col = cols - 2;
      goal.row = rows - 2;

      hp = 100;
      updateHPUI();
      isGameOver = false;
      document.getElementById('modal').style.display = 'none';

      // Inicializar Gas
      gasGrid = Array.from({ length: rows }, () => Array(cols).fill(false));
      gasQueue = [{ col: 1, row: 1 }];
      gasGrid[1][1] = true;
      nextGasTick = performance.now() + 1500; // 1.5s de gracia inicial
    }

    // Controles Touch / Giroscopio
    let tiltX = 0;
    let tiltY = 0;

    if (window.DeviceOrientationEvent) {
      const gyroBtn = document.getElementById('gyroBtn');
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        gyroBtn.style.display = 'block';
        gyroBtn.addEventListener('click', () => {
          DeviceOrientationEvent.requestPermission().then(res => {
            if (res === 'granted') {
              gyroBtn.style.display = 'none';
              window.addEventListener('deviceorientation', handleOrientation);
            }
          });
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(e) {
      if (e.gamma !== null && e.beta !== null) {
        tiltX = Math.max(-1, Math.min(1, e.gamma / 25));
        tiltY = Math.max(-1, Math.min(1, (e.beta - 25) / 25));
      }
    }

    // Controles Teclado
    window.addEventListener('keydown', (e) => {
      sfx.init();
      if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });
    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    // Controles Botones Virtuales D-PAD
    const dpadButtons = {
      btnUp: { dx: 0, dy: -1 },
      btnDown: { dx: 0, dy: 1 },
      btnLeft: { dx: -1, dy: 0 },
      btnRight: { dx: 1, dy: 0 }
    };
    let virtualD = { x: 0, y: 0 };

    Object.keys(dpadButtons).forEach(id => {
      const btn = document.getElementById(id);
      const { dx, dy } = dpadButtons[id];
      const start = (e) => {
        e.preventDefault();
        sfx.init();
        virtualD.x = dx;
        virtualD.y = dy;
        btn.classList.add('pressed');
      };
      const end = (e) => {
        e.preventDefault();
        if (virtualD.x === dx) virtualD.x = 0;
        if (virtualD.y === dy) virtualD.y = 0;
        btn.classList.remove('pressed');
      };
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
    });

    // Actualizar Barra de Vida
    function updateHPUI() {
      const fill = document.getElementById('hpFill');
      const text = document.getElementById('hpText');
      const pct = Math.max(0, Math.round(hp));
      fill.style.width = pct + '%';
      text.textContent = pct + '%';

      if (pct > 50) fill.style.background = 'linear-gradient(90deg, #22c55e, #10b981)';
      else if (pct > 25) fill.style.background = 'linear-gradient(90deg, #f59e0b, #eab308)';
      else fill.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
    }

    // Resolver colisión círculo con muros
    function resolveCollision() {
      const pCol = Math.floor(player.x / cellSize);
      const pRow = Math.floor(player.y / cellSize);

      for (let r = Math.max(0, pRow - 1); r <= Math.min(rows - 1, pRow + 1); r++) {
        for (let c = Math.max(0, pCol - 1); c <= Math.min(cols - 1, pCol + 1); c++) {
          if (grid[r][c] === 1) {
            const rx = c * cellSize;
            const ry = r * cellSize;
            const nearestX = Math.max(rx, Math.min(player.x, rx + cellSize));
            const nearestY = Math.max(ry, Math.min(player.y, ry + cellSize));

            const distX = player.x - nearestX;
            const distY = player.y - nearestY;
            const distSq = distX * distX + distY * distY;

            if (distSq < player.radius * player.radius) {
              const dist = Math.sqrt(distSq) || 0.001;
              const overlap = player.radius - dist;
              player.x += (distX / dist) * overlap;
              player.y += (distY / dist) * overlap;
            }
          }
        }
      }
    }

    // Bucle Principal
    let lastTime = performance.now();

    function update(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      if (!isGameOver) {
        // Entrada de movimiento
        let ax = 0, ay = 0;
        if (keys.ArrowUp || keys.w) ay -= 1;
        if (keys.ArrowDown || keys.s) ay += 1;
        if (keys.ArrowLeft || keys.a) ax -= 1;
        if (keys.ArrowRight || keys.d) ax += 1;

        ax += virtualD.x;
        ay += virtualD.y;

        ax += tiltX * 1.6;
        ay += tiltY * 1.6;

        const accel = 600 * dt;
        player.vx += ax * accel;
        player.vy += ay * accel;

        // Fricción
        player.vx *= 0.88;
        player.vy *= 0.88;

        player.x += player.vx * dt;
        player.y += player.vy * dt;

        resolveCollision();

        // El camino que pisa la bola deja rastro de gas retardado
        const currC = Math.floor(player.x / cellSize);
        const currR = Math.floor(player.y / cellSize);

        // Avance de la ola de gas venenoso
        const lvl = LEVELS[currentLevelIndex];
        if (now > nextGasTick && gasQueue.length > 0) {
          const nextCell = gasQueue.shift();
          const neighbors = [
            { c: nextCell.col + 1, r: nextCell.row },
            { c: nextCell.col - 1, r: nextCell.row },
            { c: nextCell.col, r: nextCell.row + 1 },
            { c: nextCell.col, r: nextCell.row - 1 }
          ];

          for (let n of neighbors) {
            if (n.c >= 0 && n.c < cols && n.r >= 0 && n.r < rows) {
              if (grid[n.r][n.c] === 0 && !gasGrid[n.r][n.c]) {
                gasGrid[n.r][n.c] = true;
                gasQueue.push({ col: n.c, r: n.r });
              }
            }
          }
          nextGasTick = now + (lvl.gasSpeed / cols);
        }

        // Comprobar si el jugador está dentro del gas
        const inGas = gasGrid[currR] && gasGrid[currR][currC];
        document.getElementById('gasAlert').style.display = inGas ? 'block' : 'none';

        if (inGas) {
          hp -= lvl.hpDrain * dt;
          sfx.damage();
          updateHPUI();

          if (hp <= 0) {
            isGameOver = true;
            sfx.lose();
            showModal("HAS MUERTO", "El gas tóxico te consumió por completo.", "REINTENTAR", () => initLevel(currentLevelIndex));
          }
        }

        // Comprobar Victoria (Llegada a la Meta)
        const distToGoal = Math.hypot(player.x - (goal.col + 0.5) * cellSize, player.y - (goal.row + 0.5) * cellSize);
        if (distToGoal < cellSize * 0.45) {
          isGameOver = true;
          sfx.win();
          if (currentLevelIndex < LEVELS.length - 1) {
            showModal("¡SECTOR SUPERADO!", "Has escapado del gas a tiempo.", "SIGUIENTE SECTOR", () => initLevel(currentLevelIndex + 1));
          } else {
            showModal("¡VICTORIA TOTAL!", "Superaste el Laberinto Imposible.", "JUGAR DE NUEVO", () => initLevel(0));
          }
        }
      }

      render();
      requestAnimationFrame(update);
    }

    function showModal(title, msg, btnText, action) {
      const modal = document.getElementById('modal');
      const modalTitle = document.getElementById('modalTitle');
      const modalMsg = document.getElementById('modalMsg');
      const modalBtn = document.getElementById('modalBtn');

      modalTitle.textContent = title;
      modalTitle.style.color = title.includes('HAS MUERTO') ? '#ef4444' : '#22c55e';
      modalMsg.textContent = msg;
      modalBtn.textContent = btnText;

      modalBtn.onclick = () => {
        action();
      };
      modal.style.display = 'flex';
    }

    // Renderizado Gráfico
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Muros y Caminos
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = c * cellSize;
          const y = r * cellSize;

          if (grid[r][c] === 1) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
            ctx.strokeRect(x, y, cellSize, cellSize);
          } else {
            ctx.fillStyle = '#030712';
            ctx.fillRect(x, y, cellSize, cellSize);

            // Dibujar Gas Tóxico
            if (gasGrid[r][c]) {
              ctx.fillStyle = 'rgba(34, 197, 94, 0.45)';
              ctx.fillRect(x, y, cellSize, cellSize);
              ctx.fillStyle = 'rgba(168, 85, 247, 0.25)';
              ctx.beginPath();
              ctx.arc(x + cellSize / 2, y + cellSize / 2, cellSize * 0.35, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      // Dibujar Portal Meta
      const gx = (goal.col + 0.5) * cellSize;
      const gy = (goal.row + 0.5) * cellSize;
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(gx, gy, cellSize * 0.38, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
      ctx.restore();

      // Dibujar Bola del Jugador
      ctx.save();
      ctx.shadowColor = hp > 25 ? '#38bdf8' : '#ef4444';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = hp > 25 ? '#e0f2fe' : '#fca5a5';
      ctx.fill();

      // Centro Neón
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = hp > 25 ? '#38bdf8' : '#ef4444';
      ctx.fill();
      ctx.restore();
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    initLevel(0);
    requestAnimationFrame(update);
  </script>
</body>
</html>
